<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppHub — متجر التطبيقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--bg:#08090b;--card:#111318;--card2:#171920;--line:#262a33;--text:#f6f7f9;--muted:#969eac;--accent:#e8b84d;--green:#3ddc97;--red:#ff5f6d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#22220f 0,#08090b 35%);color:var(--text);font-family:Cairo,Inter,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:#08090be8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.bar{max-width:1180px;margin:auto;height:70px;display:flex;align-items:center;gap:12px;padding:0 18px}.logo{font-weight:800;font-size:21px;color:var(--accent)}.spacer{flex:1}.iconbtn,.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:10px 14px}.primary{background:var(--accent);color:#17120a;border-color:var(--accent);font-weight:800}.danger{background:#32161a;color:#ff8992;border-color:#54252b}.wrap{max-width:1180px;margin:auto;padding:25px 18px 70px}.hero{padding:50px 0 25px}.hero h1{font-size:clamp(30px,6vw,58px);line-height:1.15;margin:0 0 12px}.hero p{color:var(--muted);max-width:700px}.search{display:flex;gap:10px;margin-top:24px}.search input,.field input,.field textarea,.field select{width:100%;background:#0e1014;border:1px solid var(--line);color:var(--text);border-radius:13px;padding:13px;outline:0}.search input:focus,.field input:focus,.field textarea:focus{border-color:#75602f}.chips{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:#cbd0d9;border-radius:999px;padding:8px 14px}.section{margin-top:26px}.section h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:linear-gradient(180deg,#14171d,#0f1115);border:1px solid var(--line);border-radius:19px;padding:16px}.appcard{cursor:pointer}.appicon{width:66px;height:66px;border-radius:18px;object-fit:cover;background:#222;display:grid;place-items:center;font-size:26px}.row{display:flex;align-items:center;gap:12px}.muted{color:var(--muted);font-size:13px}.tag{font-size:11px;padding:4px 8px;border-radius:999px;background:#222631;color:#bfc5d1}.form{max-width:600px;margin:35px auto}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#c9ced8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:100;padding:18px}.modalbox{background:#111318;border:1px solid var(--line);border-radius:22px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:22px}.adminnav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{padding:18px;border:1px solid var(--line);border-radius:17px;background:var(--card)}.stat b{display:block;font-size:28px}.bottom{display:none}
@media(max-width:700px){.bar{height:62px}.hero{padding-top:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:12px}.appicon{width:56px;height:56px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0c0e12ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:9px}.bottom button{background:none;color:#adb4c0}.bottom i{display:block;text-align:center}.wrap{padding-bottom:85px}}
</style></head>
<body>
<header class="top"><div class="bar"><button class="iconbtn" onclick="go('home')"><i class="fa-solid fa-grid-2"></i></button><div class="logo">AppHub</div><div class="spacer"></div><button class="iconbtn" onclick="go('search')"><i class="fa-solid fa-magnifying-glass"></i></button><button class="iconbtn" id="accountBtn" onclick="account()"><i class="fa-solid fa-user"></i></button></div></header>
<main id="app" class="wrap"></main>
<nav class="bottom"><button onclick="go('home')"><i class="fa-solid fa-house"></i>الرئيسية</button><button onclick="go('search')"><i class="fa-solid fa-magnifying-glass"></i>بحث</button><button onclick="account()"><i class="fa-solid fa-user"></i>حسابي</button></nav>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const A="/api";let token=localStorage.getItem("apphub_token"),me=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(url,opt={}){opt.headers=opt.headers||{};if(token)opt.headers.Authorization="Bearer "+token;let r=await fetch(A+url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"حدث خطأ");return j}
async function init(){try{if(token)me=(await api("/me")).user}catch(e){token=null;localStorage.removeItem("apphub_token")}go("home")}
function go(page){if(page==="home")home();else if(page==="search")search();else if(page==="login")login();else if(page==="register")register();else if(page==="account")account();else if(page==="admin")admin();else if(page==="moderator")moderator()}
async function home(){let j=await api("/apps");document.getElementById("app").innerHTML=`<section class="hero"><h1>اكتشف تطبيقاتك<br>في مكان واحد.</h1><p>منصة عربية لنشر واكتشاف تطبيقات Android و iOS مع صفحات مطورين، تقييمات ومراجعة آمنة.</p><div class="search"><input id="q" placeholder="ابحث عن تطبيق أو لعبة..." onkeydown="if(event.key==='Enter')doSearch()"><button class="btn primary" onclick="doSearch()"><i class="fa-solid fa-search"></i></button></div></section><div class="chips"><button class="chip" onclick="loadCat('ألعاب')">ألعاب</button><button class="chip" onclick="loadCat('أدوات')">أدوات</button><button class="chip" onclick="loadCat('تعليم')">تعليم</button><button class="chip" onclick="loadCat('صور')">صور</button><button class="chip" onclick="loadCat('أخرى')">أخرى</button></div><section class="section"><h2>أحدث التطبيقات</h2><div class="grid">${cards(j.apps)}</div></section>`}
function cards(a){return a.length?a.map(x=>`<article class="card appcard" onclick="appPage('${x.id}')"><div class="row"><img class="appicon" src="${x.icon||'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23222%22/><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2250%22>📱</text></svg>'}"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category)} · v${esc(x.version)}</div></div></div><p class="muted">${esc(x.description).slice(0,90)}</p></article>`).join(""):"<div class='card muted'>لا توجد تطبيقات حالياً.</div>"}
async function loadCat(c){let j=await api("/apps?category="+encodeURIComponent(c));document.getElementById("app").innerHTML=`<h2>تصنيف: ${esc(c)}</h2><div class="grid">${cards(j.apps)}</div>`}
function doSearch(){let q=document.getElementById("q")?.value||"";search(q)}
async function search(q=""){let j=await api("/apps"+(q?"?q="+encodeURIComponent(q):""));document.getElementById("app").innerHTML=`<div class="hero"><h1>البحث</h1><div class="search"><input id="q2" value="${esc(q)}" placeholder="اكتب اسم التطبيق..." onkeydown="if(event.key==='Enter')search(this.value)"><button class="btn primary" onclick="search(document.getElementById('q2').value)">بحث</button></div></div><div class="grid">${cards(j.apps)}</div>`}
async function appPage(id){let j=await api("/apps/"+id),x=j.app;document.getElementById("app").innerHTML=`<button class="btn" onclick="go('home')">← رجوع</button><section class="card" style="margin-top:14px"><div class="row"><img class="appicon" src="${x.icon||''}"><div><h1>${esc(x.name)}</h1><span class="tag">${esc(x.category)}</span> <span class="muted">v${esc(x.version)}</span></div></div><p>${esc(x.description)}</p><div class="actions">${x.androidFile?`<a class="btn primary" href="${x.androidFile}" download>Android APK</a>`:""}${x.androidUrl?`<a class="btn primary" target="_blank" href="${esc(x.androidUrl)}">Android</a>`:""}${x.iosUrl?`<a class="btn" target="_blank" href="${esc(x.iosUrl)}">iOS</a>`:""}</div></section><section class="section"><h2>التقييمات</h2>${j.reviews.map(r=>`<div class="card"><b>⭐ ${r.rating}/5</b><p>${esc(r.text)}</p><small class="muted">${esc(r.user)}</small></div>`).join("")||"<div class='card muted'>لا توجد تقييمات.</div>"}</section>${me?`<section class="card section"><h3>أضف تقييمك</h3><div class="field"><input id="rating" type="number" min="1" max="5" value="5"></div><div class="field"><textarea id="reviewText" placeholder="اكتب مراجعتك"></textarea></div><button class="btn primary" onclick="reviewApp('${x.id}')">إرسال</button></section>`:""}`}
async function reviewApp(id){try{await api("/apps/"+id+"/review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rating:+document.getElementById("rating").value,text:document.getElementById("reviewText").value})});Swal.fire("تم","تم إرسال تقييمك","success");appPage(id)}catch(e){Swal.fire("خطأ",e.message,"error")}}
function account(){if(!me)return login();document.getElementById("app").innerHTML=`<section class="card form"><div class="row"><div class="appicon">👤</div><div><h2>${esc(me.name)}</h2><div class="muted">@${esc(me.username)} · ${esc(me.role)}</div></div></div><hr style="border-color:var(--line);border-width:1px 0 0;margin:20px 0"><div class="actions">${me.role!=="user"?`<button class="btn primary" onclick="${me.role==="admin"?"go('admin')":"go('moderator')"}">لوحة التحكم</button>`:""}<button class="btn danger" onclick="logout()">تسجيل الخروج</button></div></section>`}
function login(){document.getElementById("app").innerHTML=`<form class="card form" onsubmit="event.preventDefault();loginDo()"><h1>تسجيل الدخول</h1><div class="field"><label>البريد أو اسم المستخدم</label><input id="login" required></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password" required></div><button class="btn primary">دخول</button><button type="button" class="btn" onclick="register()">إنشاء حساب</button></form>`}
async function loginDo(){try{let j=await api("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:login.value,password:pass.value})});token=j.token;localStorage.setItem("apphub_token",token);me=j.user;Swal.fire("مرحباً","تم تسجيل الدخول","success");go("home")}catch(e){Swal.fire("خطأ",e.message,"error")}}
function register(){document.getElementById("app").innerHTML=`<form class="card form" onsubmit="event.preventDefault();registerDo()"><h1>إنشاء حساب</h1><div class="field"><label>الاسم</label><input id="name" required></div><div class="field"><label>اسم المستخدم</label><input id="username" required pattern="[A-Za-z0-9_]{3,24}"></div><div class="field"><label>البريد</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="pass2" type="password" minlength="6" required></div><button class="btn primary">إنشاء الحساب</button><button type="button" class="btn" onclick="login()">لدي حساب</button></form>`}
async function registerDo(){try{let j=await api("/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,username:username.value,email:email.value,password:pass2.value})});token=j.token;localStorage.setItem("apphub_token",token);me=j.user;go("home")}catch(e){Swal.fire("خطأ",e.message,"error")}}
function logout(){token=null;me=null;localStorage.removeItem("apphub_token");go("home")}
async function admin(){if(!me||me.role!=="admin")return account();let s=await api("/admin/summary");document.getElementById("app").innerHTML=`<h1>لوحة الأدمن</h1><div class="stats"><div class="stat">المستخدمون<b>${s.users}</b></div><div class="stat">التطبيقات<b>${s.apps}</b></div><div class="stat">قيد المراجعة<b>${s.pending}</b></div><div class="stat">التقييمات<b>${s.reviews}</b></div></div><section class="section"><div class="actions"><button class="btn primary" onclick="pending()">مراجعة التطبيقات</button><button class="btn" onclick="users()">المستخدمون</button></div><div class="card" style="margin-top:15px"><h3>آخر العمليات</h3><div class="tablewrap"><table class="table"><tr><th>العملية</th><th>الوقت</th></tr>${s.logs.map(l=>`<tr><td>${esc(l.action)}</td><td>${new Date(l.at).toLocaleString("ar-SA")}</td></tr>`).join("")}</table></div></div></section>`}
async function pending(){let j=await api("/admin/pending");document.getElementById("app").innerHTML=`<h1>التطبيقات قيد المراجعة</h1><div class="grid">${j.apps.map(x=>`<div class="card"><div class="row"><img class="appicon" src="${x.icon}"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category)}</div></div></div><p>${esc(x.description)}</p><div class="actions"><button class="btn primary" onclick="statusApp('${x.id}','published')">قبول ونشر</button><button class="btn danger" onclick="statusApp('${x.id}','rejected')">رفض</button></div></div>`).join("")||"<div class='card'>لا يوجد شيء.</div>"}</div>`}
async function statusApp(id,status){let reason=status==="rejected"?prompt("سبب الرفض؟")||"":"";await api("/apps/"+id+"/review-status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,reason})});pending()}
async function users(){let j=await api("/admin/users");document.getElementById("app").innerHTML=`<h1>المستخدمون</h1><div class="card tablewrap"><table class="table"><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr>${j.users.map(u=>`<tr><td>${esc(u.name)}<br><span class="muted">@${esc(u.username)}</span></td><td><select onchange="setRole('${u.id}',this.value)"><option ${u.role==="user"?"selected":""}>user</option><option ${u.role==="moderator"?"selected":""}>moderator</option><option ${u.role==="admin"?"selected":""}>admin</option></select></td><td>${u.banned?"محظور":"نشط"}</td><td><button class="btn danger" onclick="ban('${u.id}',${!u.banned})">${u.banned?"فك الحظر":"حظر"}</button></td></tr>`).join("")}</table></div>`}
async function setRole(id,role){await api("/admin/users/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({role})});users()}
async function ban(id,v){await api("/admin/users/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({banned:v})});users()}
async function moderator(){if(!me||!["admin","moderator"].includes(me.role))return account();pending()}
async function account(){if(!me)return login();document.getElementById("app").innerHTML=`<section class="card form"><div class="row"><div class="appicon">👤</div><div><h2>${esc(me.name)}</h2><div class="muted">@${esc(me.username)} · ${esc(me.role)}</div></div></div><div class="actions">${me.role==="admin"?`<button class="btn primary" onclick="admin()">لوحة الأدمن</button>`:""}${me.role==="moderator"?`<button class="btn primary" onclick="moderator()">المراجعة</button>`:""}<button class="btn danger" onclick="logout()">تسجيل الخروج</button></div></section>`}
init();
</script></body></html>
